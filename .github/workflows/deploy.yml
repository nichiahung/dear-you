name: Deploy to Firebase

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'functions/**'
      - 'firebase.json'
      - '.firebaserc'
      - 'firestore.rules'
      - 'storage.rules'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: 'Also deploy Cloud Functions. Requires iam.serviceAccounts.ActAs for the Firebase service account.'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-live
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install frontend dependencies
        run: npm ci

      - name: Build frontend
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.FIREBASE_WEB_API_KEY }}
        run: |
          test -n "$VITE_FIREBASE_API_KEY"
          npm run build

      - name: Install functions dependencies
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_functions }}
        run: npm ci
        working-directory: functions

      - name: Authenticate Firebase
        run: |
          printf '%s' '${{ secrets.FIREBASE_SERVICE_ACCOUNT_DEARYOU_BFFFC }}' > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Deploy Firebase Hosting
        run: npx firebase-tools deploy --only hosting --project dearyou-bfffc --non-interactive

      - name: Deploy Firebase Functions
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy_functions }}
        run: npx firebase-tools deploy --only functions --project dearyou-bfffc --non-interactive
